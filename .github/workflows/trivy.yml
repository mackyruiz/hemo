name: scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Tuesday 05:00 UTC: dependency CVEs appear over time even when the
    # repo doesn't change, so rescan weekly regardless of pushes.
    - cron: "0 5 * * 2"
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan (SARIF for the Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivy-version: 0.76.2
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
      - name: Gate - fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivy-version: 0.76.2
          exit-code: "1"
