[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="data/*.json, data/questions/*.json, assets/fonts/*.txt, assets/lab/*.txt, assets/icons/*.txt"
exclude_filter="tests/*, tools/*, addons/gut/*, build/*"
export_path="build/web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
html/canvas_resize_policy=2
progressive_web_app/enabled=true
progressive_web_app/display=1
progressive_web_app/orientation=2
progressive_web_app/background_color=Color(0.968627, 0.956863, 0.94902, 1)
